        /* ==========================================================================

        html { scroll-behavior: smooth; }

            -webkit-background-clip: text;

            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
